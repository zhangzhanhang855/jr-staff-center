<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Apple Music - JR Player</title>
    
    <!-- Load Google Sans Webfonts -->
    <style>
        @font-face {
            font-family: 'Google Sans';
            font-style: normal;
            font-weight: 400;
            font-display: swap;
            src: url('https://fonts.gstatic.com/s/googlesans/v58/4UaGrENHsxJlGDuGo1OIlL3Owp4.woff2') format('woff2');
        }
        @font-face {
            font-family: 'Google Sans';
            font-style: normal;
            font-weight: 500;
            font-display: swap;
            src: url('https://fonts.gstatic.com/s/googlesans/v58/4UabrENHsxJlGDuGo1OIlLU94YtzCwM.woff2') format('woff2');
        }
        @font-face {
            font-family: 'Google Sans';
            font-style: normal;
            font-weight: 700;
            font-display: swap;
            src: url('https://fonts.gstatic.com/s/googlesans/v58/4UabrENHsxJlGDuGo1OIlLV14YtzCwM.woff2') format('woff2');
        }

        *, *::before, *::after {
            font-family: 'Google Sans', -apple-system, BlinkMacSystemFont, sans-serif !important;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        input {
            -webkit-user-select: text;
            user-select: text;
        }

        :root {
            --am-accent: #FA233B;
            --am-accent-glow: rgba(250, 35, 59, 0.35);
            --ios-radius-lg: 32px;
            --ios-radius-md: 20px;
            --ios-radius-sm: 12px;
            --safe-top: env(safe-area-inset-top, 20px);
            --safe-bottom: env(safe-area-inset-bottom, 20px);
        }

        body { 
            background: #000; 
            color: #fff; 
            height: 100vh; 
            width: 100vw;
            overflow: hidden; 
            -webkit-font-smoothing: antialiased;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Outer iOS App Container with Smooth Apple Continuous Curve */
        #app-container { 
            width: 100vw; 
            height: 100vh; 
            position: relative;
            overflow: hidden;
            display: flex;
            background-color: #050505;
        }

        /* Fluid Multi-Layer Dynamic Background Mesh */
        .am-backdrop-mesh {
            position: absolute;
            inset: -20%;
            background-size: cover;
            background-position: center;
            filter: blur(90px) brightness(0.4) saturate(2.2);
            z-index: 0;
            transform: scale(1.1);
            transition: background-image 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .am-backdrop-tint {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 20% 30%, rgba(255,255,255,0.06) 0%, rgba(0,0,0,0.55) 100%),
                        linear-gradient(to bottom, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.7) 100%);
            z-index: 1;
            pointer-events: none;
        }

        /* Main Workspace Split Layout */
        .am-stage {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            padding: var(--safe-top) 24px var(--safe-bottom) 24px;
            overflow: hidden;
        }

        @media (min-width: 860px) {
            .am-stage {
                flex-direction: row;
                gap: 40px;
                padding: calc(var(--safe-top) + 16px) 48px calc(var(--safe-bottom) + 16px) 48px;
            }
        }

        /* Left Side: Now Playing & Library */
        .am-left-column {
            display: flex;
            flex-direction: column;
            flex: 1;
            max-width: 100%;
            height: 100%;
            overflow: hidden;
            justify-content: space-between;
        }

        @media (min-width: 860px) {
            .am-left-column {
                flex: 0 0 45%;
                max-width: 480px;
            }
        }

        /* Header / Sync Toggle Row */
        .am-header-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            flex-shrink: 0;
        }

        .am-brand-tag {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: rgba(255, 255, 255, 0.45);
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .am-brand-tag span {
            color: var(--am-accent);
            font-size: 16px;
        }

        .am-btn-ghost-pill {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 0.5px solid rgba(255, 255, 255, 0.15);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: #fff;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.2, 0, 0.2, 1);
        }

        .am-btn-ghost-pill:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.2);
        }

        /* Config / Sync Popover Modal Bar */
        .am-sync-drawer {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            background: rgba(25, 25, 28, 0.7);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-radius: var(--ios-radius-md);
            border: 0.5px solid rgba(255, 255, 255, 0.12);
            transition: all 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
            margin-bottom: 0;
            flex-shrink: 0;
        }

        .am-sync-drawer.open {
            max-height: 90px;
            opacity: 1;
            margin-bottom: 16px;
            padding: 10px;
        }

        .am-sync-inputs {
            display: flex;
            gap: 8px;
        }

        .am-input-native {
            flex: 1;
            background: rgba(255, 255, 255, 0.08);
            border: 0.5px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--ios-radius-sm);
            padding: 8px 12px;
            font-size: 12px;
            color: #fff;
            outline: none;
            transition: background 0.2s;
        }

        .am-input-native:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .am-input-native::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }

        .am-btn-accent {
            background: var(--am-accent);
            border: none;
            color: #fff;
            font-weight: 700;
            font-size: 12px;
            padding: 0 16px;
            border-radius: var(--ios-radius-sm);
            cursor: pointer;
            box-shadow: 0 4px 14px var(--am-accent-glow);
            transition: transform 0.15s;
        }

        .am-btn-accent:active {
            transform: scale(0.95);
        }

        /* Interactive Core Player Hub */
        .am-hub-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
            width: 100%;
        }

        @media (min-width: 860px) {
            .am-hub-card {
                align-items: flex-start;
            }
        }

        .am-artwork-wrapper {
            position: relative;
            width: 180px;
            height: 180px;
            margin-bottom: 20px;
            align-self: center;
            transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.2, 1);
        }

        @media (min-width: 860px) {
            .am-artwork-wrapper {
                width: 230px;
                height: 230px;
                margin-bottom: 24px;
            }
        }

        .am-artwork-img {
            width: 100%;
            height: 100%;
            border-radius: var(--ios-radius-md);
            background-color: #1a1a1c;
            background-size: cover;
            background-position: center;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.55);
            border: 0.5px solid rgba(255, 255, 255, 0.16);
            transition: opacity 0.5s ease;
        }

        .am-artwork-wrapper.playing {
            transform: scale(1.04);
        }

        .am-artwork-wrapper.paused {
            transform: scale(0.94);
        }

        .am-hero-meta {
            width: 100%;
            margin-bottom: 16px;
            text-align: center;
        }

        @media (min-width: 860px) {
            .am-hero-meta {
                text-align: left;
            }
        }

        .am-hero-title {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .am-hero-sub {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 4px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.55);
            font-weight: 500;
        }

        @media (min-width: 860px) {
            .am-hero-sub {
                justify-content: flex-start;
            }
        }

        .am-mode-pill {
            font-size: 10px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.85);
            background: rgba(255, 255, 255, 0.12);
            padding: 2px 7px;
            border-radius: 6px;
            letter-spacing: 0.5px;
        }

        /* Scrubber */
        .am-timeline {
            width: 100%;
            margin-bottom: 16px;
        }

        .am-scrubber-track {
            width: 100%;
            height: 24px;
            display: flex;
            align-items: center;
            cursor: pointer;
            touch-action: none;
        }

        .am-scrubber-bg {
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.16);
            border-radius: 3px;
            overflow: hidden;
            position: relative;
        }

        .am-scrubber-fill {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            background: #ffffff;
            border-radius: 3px;
            width: 0%;
        }

        .am-time-readout {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.45);
            font-variant-numeric: tabular-nums;
            margin-top: -4px;
        }

        /* Controls Deck */
        .am-actions-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 36px;
            width: 100%;
            margin-bottom: 20px;
        }

        .am-control-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.15s, transform 0.15s;
        }

        .am-control-btn:active {
            color: #fff;
            transform: scale(0.9);
        }

        .am-play-fab {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #ffffff;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(255, 255, 255, 0.2);
            transition: transform 0.2s cubic-bezier(0.2, 0, 0.2, 1), box-shadow 0.2s;
        }

        .am-play-fab:active {
            transform: scale(0.92);
        }

        /* Integrated Library Card */
        .am-media-vault {
            flex: 1;
            min-height: 180px;
            background: rgba(18, 18, 22, 0.55);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border-radius: var(--ios-radius-md);
            border: 0.5px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .am-vault-top {
            padding: 10px 12px 6px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-bottom: 0.5px solid rgba(255, 255, 255, 0.06);
        }

        .am-search-field {
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            border: none;
            border-radius: 10px;
            padding: 6px 12px;
            font-size: 12px;
            color: #fff;
            outline: none;
        }

        .am-search-field:focus {
            background: rgba(255, 255, 255, 0.14);
        }

        .am-pills-row {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .am-vault-pill {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            border-radius: 12px;
            padding: 4px 10px;
            font-size: 11px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.6);
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
        }

        .am-vault-pill.active {
            background: rgba(255, 255, 255, 0.22);
            color: #ffffff;
        }

        .am-list-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 6px 8px;
        }

        .am-track-row {
            display: flex;
            align-items: center;
            padding: 8px 10px;
            border-radius: var(--ios-radius-sm);
            cursor: pointer;
            transition: background 0.15s;
        }

        .am-track-row:active {
            background: rgba(255, 255, 255, 0.08);
        }

        .am-track-row.current {
            background: rgba(250, 35, 59, 0.16);
        }

        .am-track-index {
            font-size: 11px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.35);
            width: 22px;
            text-align: right;
            margin-right: 10px;
            font-variant-numeric: tabular-nums;
        }

        .am-track-name {
            flex: 1;
            font-size: 13px;
            font-weight: 500;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .am-track-row.current .am-track-name {
            color: var(--am-accent);
            font-weight: 700;
        }

        .am-eq-bars {
            display: none;
            align-items: flex-end;
            gap: 2px;
            height: 12px;
            margin-left: 8px;
        }

        .am-track-row.current .am-eq-bars {
            display: flex;
        }

        .am-eq-col {
            width: 2px;
            height: 100%;
            background: var(--am-accent);
            border-radius: 1px;
            animation: eqAnim 0.9s ease-in-out infinite alternate;
        }

        .am-eq-col:nth-child(2) { animation-delay: 0.25s; height: 60%; }
        .am-eq-col:nth-child(3) { animation-delay: 0.45s; height: 80%; }

        @keyframes eqAnim {
            0% { transform: scaleY(0.25); }
            100% { transform: scaleY(1); }
        }

        /* Right Side: Immersive Apple Lyrics Stage */
        .am-right-column {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            border-radius: var(--ios-radius-lg);
            overflow: hidden;
        }

        .am-lyrics-mask {
            flex: 1;
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 12%, #000 85%, transparent 100%);
            mask-image: linear-gradient(180deg, transparent 0%, #000 12%, #000 85%, transparent 100%);
        }

        .am-lyrics-scroller {
            position: absolute;
            inset: 0;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        .am-lyrics-flow {
            max-width: 680px;
            padding: 40vh 12px 60vh 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        @media (min-width: 860px) {
            .am-lyrics-flow {
                padding: 35vh 24px 60vh 24px;
                gap: 16px;
            }
        }

        /* Master Lyric Unit */
        .am-lyric-block {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 8px 12px;
            border-radius: 14px;
            cursor: pointer;
            transform-origin: left center;
            opacity: 0.35;
            filter: blur(0.5px);
            transition: all 0.5s cubic-bezier(0.2, 0.9, 0.2, 1);
        }

        .am-lyric-block:hover {
            opacity: 0.65;
            background: rgba(255, 255, 255, 0.04);
        }

        .am-lyric-primary {
            font-size: 26px;
            font-weight: 700;
            line-height: 1.25;
            letter-spacing: -0.4px;
            color: #ffffff;
        }

        @media (min-width: 860px) {
            .am-lyric-primary {
                font-size: 38px;
                line-height: 1.22;
                letter-spacing: -0.6px;
            }
        }

        /* Subtitle Translation: Positioned Underneath & Scaled Down */
        .am-lyric-translation {
            font-size: 15px;
            font-weight: 500;
            line-height: 1.35;
            color: rgba(255, 255, 255, 0.55);
            letter-spacing: -0.2px;
            margin-top: 2px;
        }

        @media (min-width: 860px) {
            .am-lyric-translation {
                font-size: 20px;
                line-height: 1.3;
            }
        }

        /* Active Lyric Glow */
        .am-lyric-block.active {
            opacity: 1;
            filter: blur(0px);
            transform: scale(1.03);
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .am-lyric-block.active .am-lyric-translation {
            color: rgba(255, 255, 255, 0.85);
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .am-lyrics-empty {
            font-size: 24px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.3);
            margin-top: 20vh;
            letter-spacing: -0.5px;
        }

        .hidden-ui { display: none !important; }
    </style>
</head>
<body>

    <div id="app-container">
        <!-- Live Liquid Blur Canvas -->
        <div id="dynamic-bg" class="am-backdrop-mesh"></div>
        <div class="am-backdrop-tint"></div>

        <div class="am-stage">
            
            <!-- LEFT WORKSPACE: HUB & CONTROLS -->
            <section class="am-left-column">
                
                <!-- Navigation Top Row -->
                <div class="am-header-bar">
                    <div class="am-brand-tag">
                        <span></span> Music
                    </div>
                    <button class="am-btn-ghost-pill" id="toggle-sync-btn">GitHub Cloud</button>
                </div>

                <!-- Collapsible Native Sync Drawer -->
                <div class="am-sync-drawer" id="sync-drawer">
                    <div class="am-sync-inputs">
                        <input class="am-input-native" id="gh-user" placeholder="GitHub User" type="text">
                        <input class="am-input-native" id="gh-repo" placeholder="Repository" type="text">
                        <button class="am-btn-accent" id="btn-sync">SYNC</button>
                    </div>
                </div>

                <!-- Player Core Hub -->
                <div class="am-hub-card">
                    <div id="cover-container" class="am-artwork-wrapper paused">
                        <div id="cover-art-main" class="am-artwork-img opacity-0"></div>
                        <span class="absolute inset-0 flex items-center justify-center text-6xl pointer-events-none" id="cover-emoji" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 54px; opacity: 0.3;">🎵</span>
                    </div>

                    <div class="am-hero-meta">
                        <h2 class="am-hero-title" id="title">Not Playing</h2>
                        <div class="am-hero-sub">
                            <span class="am-mode-pill" id="lcd-mode">LIST</span>
                            <span id="album-name">JRmusic Engine</span>
                        </div>
                    </div>

                    <!-- Scrubber Timeline -->
                    <div class="am-timeline">
                        <div class="am-scrubber-track" id="scrubber-touch">
                            <div class="am-scrubber-bg">
                                <div class="am-scrubber-fill" id="scrubber-bar"></div>
                            </div>
                        </div>
                        <div class="am-time-readout">
                            <span id="cur-time">0:00</span>
                            <span id="total-time">0:00</span>
                        </div>
                    </div>

                    <!-- Transport Action Deck -->
                    <div class="am-actions-bar">
                        <button class="am-control-btn" id="mode-btn" title="Loop Mode">
                            <svg width="22" height="20" viewBox="0 0 22 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 1l4 4-4 4"/><path d="M3 11l-4 4 4 4"/><path d="M21 5H9a5 5 0 0 0-5 5v3"/><path d="M1 15h12a5 5 0 0 0 5-5V7"/></svg>
                        </button>
                        
                        <button class="am-play-fab" id="btn-play">
                            <svg id="play-svg" width="22" height="22" viewBox="0 0 24 24" fill="#000000">
                                <path id="play-path" d="M8 5.14v14.72a1 1 0 0 0 1.5.86l11-7.36a1 1 0 0 0 0-1.72l-11-7.36a1 1 0 0 0-1.5.86z"/>
                                <path id="pause-path" class="hidden-ui" d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                            </svg>
                        </button>
                        
                        <button class="am-control-btn" id="btn-next" title="Next Song">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M5 4l10 8-10 8V4z"/><path d="M16 4h3v16h-3z"/></svg>
                        </button>
                    </div>
                </div>

                <!-- Integrated Media Vault -->
                <div class="am-media-vault">
                    <div class="am-vault-top">
                        <input class="am-search-field" id="search-input" placeholder="Search playlist..." type="text">
                        <div class="am-pills-row no-scrollbar" id="playlist-nav"></div>
                    </div>
                    <div class="am-list-scroll no-scrollbar">
                        <ul id="track-list"></ul>
                    </div>
                </div>
            </section>

            <!-- RIGHT WORKSPACE: IMMERSIVE APPLE LYRICS -->
            <section class="am-right-column">
                <div class="am-lyrics-mask">
                    <div class="am-lyrics-scroller no-scrollbar" id="lyrics-scroller">
                        <div class="am-lyrics-flow" id="lyrics-flow">
                            <div class="am-lyrics-empty">Instrumental / No Lyrics</div>
                        </div>
                    </div>
                </div>
            </section>

        </div>

        <audio id="player-audio-main" playsinline></audio>
    </div>

    <!-- SCRIPT ENGINE -->
    <script>
        const audio = document.getElementById('player-audio-main');
        const titleEl = document.getElementById('title');
        const albumNameEl = document.getElementById('album-name');
        const curTimeEl = document.getElementById('cur-time');
        const totalTimeEl = document.getElementById('total-time');
        const scrubberBar = document.getElementById('scrubber-bar');
        const scrubberTouch = document.getElementById('scrubber-touch');
        
        const btnPlay = document.getElementById('btn-play');
        const playPath = document.getElementById('play-path');
        const pausePath = document.getElementById('pause-path');
        const coverContainer = document.getElementById('cover-container');
        const artEl = document.getElementById('cover-art-main');
        const dynBgEl = document.getElementById('dynamic-bg');
        const emjEl = document.getElementById('cover-emoji');
        
        const btnNext = document.getElementById('btn-next');
        const btnMode = document.getElementById('mode-btn');
        const lcdMode = document.getElementById('lcd-mode');
        const navContainer = document.getElementById('playlist-nav');
        const listContainer = document.getElementById('track-list');
        const searchInput = document.getElementById('search-input');
        
        const toggleSyncBtn = document.getElementById('toggle-sync-btn');
        const syncDrawer = document.getElementById('sync-drawer');
        const ghUserInp = document.getElementById('gh-user');
        const ghRepoInp = document.getElementById('gh-repo');
        const btnSync = document.getElementById('btn-sync');
        
        const lyricsScroller = document.getElementById('lyrics-scroller');
        const lyricsFlow = document.getElementById('lyrics-flow');

        let playlists = {};
        let currentPlaylist = 'Root';
        let filteredTracks = [];
        let curIdx = 0;
        let loopMode = 'list';
        let currentCoverObjectURL = null;
        
        let parsedLyrics = [];
        let currentLyricIndex = -1;
        let isSyncedLyrics = false;
        let isDraggingProgress = false;

        let currentTrackMeta = { title: '', artist: 'JRmusic', album: 'Engine', coverUrl: null };

        const savedUser = localStorage.getItem('jrmusic_gh_user') || 'zhangzhanhang855';
        const savedRepo = localStorage.getItem('jrmusic_gh_repo') || 'musiconly';
        ghUserInp.value = savedUser;
        ghRepoInp.value = savedRepo;

        // Load jsmediatags
        if (!window.jsmediatags) {
            const script = document.createElement('script');
            script.src = 'https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js';
            document.head.appendChild(script);
        }

        // Toggle Sync Drawer
        toggleSyncBtn.onclick = () => {
            syncDrawer.classList.toggle('open');
        };

        // Aggressively Parse ID3 Lyrics
        function aggressivelyFindLyrics(tags) {
            if (!tags) return "";
            const extract = (obj) => {
                if (!obj) return "";
                if (typeof obj === 'string') return obj;
                if (typeof obj.text === 'string') return obj.text;
                if (typeof obj.lyrics === 'string') return obj.lyrics;
                if (obj.data && typeof obj.data.text === 'string') return obj.data.text;
                return "";
            };
            let primary = extract(tags.lyrics) || extract(tags.USLT) || extract(tags.SYLT);
            if (primary && primary.includes('[')) return primary;
            for (let key in tags) {
                const item = tags[key];
                const arr = Array.isArray(item) ? item : [item];
                for (let i of arr) {
                    let txt = extract(i);
                    if (typeof txt === 'string' && txt.includes('[00:')) return txt;
                }
            }
            return primary; 
        }

        // Lyrics Extraction: Main Line + Bottom Subtitle Translation
        function processLyrics(rawText) {
            lyricsFlow.innerHTML = '';
            currentLyricIndex = -1;

            if (!rawText || typeof rawText !== 'string' || rawText.trim() === "") {
                parsedLyrics = [];
                isSyncedLyrics = false;
                lyricsFlow.innerHTML = '<div class="am-lyrics-empty">Instrumental / No Lyrics</div>';
                return;
            }
            
            const cleanText = rawText.replace(/\0/g, '').trim();
            const lines = cleanText.split(/\r?\n/);
            const timeReg = /\[(\d{1,3}):(\d{1,2})(?:[.:](\d{1,3}))?\]/g;
            parsedLyrics = [];
            
            // Matches (翻译: ...) or （翻译：...）
            const translationRegex = /[（(](?:翻译|translation)[：:](.*?)[）)]/i;

            for (let line of lines) {
                line = line.trim();
                if (!line) continue;

                let match;
                let timeTags = [];
                timeReg.lastIndex = 0; 
                while ((match = timeReg.exec(line)) !== null) {
                    const m = parseInt(match[1], 10);
                    const s = parseInt(match[2], 10);
                    const msStr = match[3] || '0';
                    const ms = parseInt(msStr.padEnd(3, '0').slice(0, 3), 10);
                    timeTags.push(m * 60 + s + ms / 1000);
                }
                
                if (timeTags.length > 0) {
                    let rawLineContent = line.replace(/\[\d{1,3}:\d{1,2}(?:[.:]\d{1,3})?\]/g, '').trim();
                    let mainText = rawLineContent;
                    let translationText = '';

                    const tMatch = rawLineContent.match(translationRegex);
                    if (tMatch) {
                        translationText = tMatch[1].trim();
                        mainText = rawLineContent.replace(tMatch[0], '').trim();
                    }

                    if (!mainText && !translationText) mainText = "...";

                    for (let t of timeTags) {
                        parsedLyrics.push({ 
                            time: t, 
                            main: mainText, 
                            translation: translationText 
                        });
                    }
                }
            }
            
            if (parsedLyrics.length > 0) {
                isSyncedLyrics = true;
                parsedLyrics.sort((a, b) => a.time - b.time);
                
                lyricsFlow.innerHTML = parsedLyrics.map((l, i) => {
                    const translationHtml = l.translation ? `<div class="am-lyric-translation">${l.translation}</div>` : '';
                    return `
                    <div class="am-lyric-block" id="lyric-${i}" data-time="${l.time}">
                        <div class="am-lyric-primary">${l.main}</div>
                        ${translationHtml}
                    </div>`;
                }).join('');
                
                lyricsFlow.querySelectorAll('.am-lyric-block').forEach(el => {
                    el.onclick = () => {
                        const seekTime = parseFloat(el.getAttribute('data-time'));
                        if (!isNaN(seekTime)) {
                            audio.currentTime = seekTime;
                            if (audio.paused) audio.play().catch(()=>{});
                        }
                    };
                });
            } else {
                isSyncedLyrics = false;
                lyricsFlow.innerHTML = `<div class="text-left text-white/50 text-lg whitespace-pre-wrap leading-relaxed px-2 font-medium">${cleanText}</div>`;
            }
        }

        function formatTime(s) {
            if (isNaN(s)) return '0:00';
            let m = Math.floor(s / 60);
            let sec = Math.floor(s % 60);
            return m + ':' + sec.toString().padStart(2, '0');
        }

        const updateMediaSession = (lyricSnippet = null) => {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({ 
                    title: currentTrackMeta.title, 
                    artist: lyricSnippet || currentTrackMeta.artist, 
                    album: currentTrackMeta.album, 
                    artwork: currentTrackMeta.coverUrl ? [{ src: currentTrackMeta.coverUrl, sizes: '512x512', type: 'image/jpeg' }] : [] 
                });
                
                navigator.mediaSession.setActionHandler('play', () => audio.play());
                navigator.mediaSession.setActionHandler('pause', () => audio.pause());
                navigator.mediaSession.setActionHandler('previoustrack', () => playNext(-1));
                navigator.mediaSession.setActionHandler('nexttrack', () => playNext(1));
            }
        };

        const filterAudio = (items) => {
            const audioRegex = /\.(mp3|flac|wav|m4a|aac)$/i;
            const extRegex = /\.[^/.]+$/;
            return items.filter(f => audioRegex.test(f.name)).map(f => ({
                t: f.name.replace(extRegex, ''),
                u: f.download_url
            }));
        };

        const renderNav = () => {
            navContainer.innerHTML = Object.keys(playlists).map(name => 
                `<button class="am-vault-pill ${name === currentPlaylist ? 'active' : ''}" data-name="${name}">${name}</button>`
            ).join('');
            
            navContainer.querySelectorAll('.am-vault-pill').forEach(btn => {
                btn.onclick = () => {
                    currentPlaylist = btn.dataset.name;
                    searchInput.value = '';
                    filteredTracks = [...playlists[currentPlaylist]];
                    renderNav();
                    renderList();
                    if (filteredTracks.length > 0) executeLoad(0, false);
                };
            });
        };

        const renderList = () => {
            listContainer.innerHTML = filteredTracks.map((s, i) => {
                const isActive = curIdx === i;
                return `
                <li class="am-track-row ${isActive ? 'current' : ''}" data-idx="${i}">
                    <span class="am-track-index">${String(i + 1).padStart(2, '0')}</span>
                    <span class="am-track-name">${s.t}</span>
                    <div class="am-eq-bars">
                        <div class="am-eq-col"></div>
                        <div class="am-eq-col"></div>
                        <div class="am-eq-col"></div>
                    </div>
                </li>`;
            }).join('');
            
            listContainer.querySelectorAll('.am-track-row').forEach(item => {
                item.onclick = () => executeLoad(parseInt(item.dataset.idx), true);
            });
        };

        const executeLoad = (idx, autoPlay) => {
            if (filteredTracks.length === 0) return;
            
            if (idx < 0) idx = filteredTracks.length - 1;
            if (idx >= filteredTracks.length) idx = 0;
            curIdx = idx;
            
            const song = filteredTracks[curIdx];
            
            audio.src = song.u;
            audio.load();
            titleEl.innerText = song.t;
            albumNameEl.innerText = currentPlaylist;
            curTimeEl.innerText = '0:00';
            totalTimeEl.innerText = '0:00';
            scrubberBar.style.width = '0%';

            currentTrackMeta = { title: song.t, artist: 'JRmusic', album: currentPlaylist, coverUrl: null };

            artEl.classList.remove('opacity-100');
            artEl.classList.add('opacity-0');
            artEl.style.backgroundImage = 'none';
            dynBgEl.style.backgroundImage = 'none';
            emjEl.classList.remove('hidden-ui');
            
            processLyrics(null);
            lyricsScroller.scrollTo({ top: 0, behavior: 'auto' });

            if (currentCoverObjectURL) {
                URL.revokeObjectURL(currentCoverObjectURL);
                currentCoverObjectURL = null;
            }

            renderList();
            updateMediaSession();

            if (autoPlay) {
                audio.play().catch(()=>{});
            }

            let lyricsLoaded = false;

            // Fetch LRC
            const lrcUrl = song.u.replace(/\.(mp3|flac|wav|m4a|aac)$/i, '.lrc');
            fetch(lrcUrl)
                .then(res => { if (res.ok) return res.text(); throw new Error(); })
                .then(lrcText => {
                    if (lrcText && lrcText.trim() && !lyricsLoaded) {
                        lyricsLoaded = true;
                        processLyrics(lrcText);
                    }
                })
                .catch(()=>{});

            // Fetch Tag Artwork & ID3
            fetch(song.u)
                .then(res => { if (!res.ok) throw new Error(); return res.blob(); })
                .then(audioBlob => {
                    if (!window.jsmediatags) return;
                    new window.jsmediatags.Reader(audioBlob).read({
                        onSuccess: (tag) => {
                            const tags = tag.tags;
                            if (tags.title) currentTrackMeta.title = tags.title;
                            if (tags.artist) currentTrackMeta.artist = tags.artist;
                            if (tags.album) currentTrackMeta.album = tags.album;
                            titleEl.innerText = currentTrackMeta.title;
                            albumNameEl.innerText = currentTrackMeta.artist;

                            const pic = tags.picture;
                            if (pic) {
                                const byteArray = new Uint8Array(pic.data);
                                const coverBlob = new Blob([byteArray], { type: pic.format });
                                currentCoverObjectURL = URL.createObjectURL(coverBlob);
                                currentTrackMeta.coverUrl = currentCoverObjectURL;
                                
                                artEl.style.backgroundImage = `url(${currentCoverObjectURL})`;
                                dynBgEl.style.backgroundImage = `url(${currentCoverObjectURL})`;
                                artEl.classList.remove('opacity-0');
                                artEl.classList.add('opacity-100');
                                emjEl.classList.add('hidden-ui');
                            }
                            
                            updateMediaSession();

                            if (!lyricsLoaded) {
                                const embeddedLrc = aggressivelyFindLyrics(tags);
                                if (embeddedLrc) processLyrics(embeddedLrc);
                            }
                        },
                        onError: () => {}
                    });
                })
                .catch(()=>{});
        };

        function playNext(direction = 1) {
            if (filteredTracks.length === 0) return;
            let nextIdx = curIdx;
            
            if (loopMode === 'random') {
                if (filteredTracks.length > 1) {
                    while (nextIdx === curIdx) {
                        nextIdx = Math.floor(Math.random() * filteredTracks.length);
                    }
                } else {
                    nextIdx = 0;
                }
            } else {
                nextIdx = curIdx + direction;
            }
            executeLoad(nextIdx, true);
        }

        // Media Event Hooks
        audio.onplay = () => { 
            playPath.classList.add('hidden-ui');
            pausePath.classList.remove('hidden-ui');
            coverContainer.classList.remove('paused');
            coverContainer.classList.add('playing');
            renderList();
        };
        
        audio.onpause = () => { 
            playPath.classList.remove('hidden-ui');
            pausePath.classList.add('hidden-ui');
            coverContainer.classList.remove('playing');
            coverContainer.classList.add('paused');
            renderList();
        };

        audio.onended = () => {
            if (loopMode === 'single') {
                audio.currentTime = 0;
                audio.play();
            } else {
                playNext(1);
            }
        };

        audio.onloadedmetadata = () => {
            totalTimeEl.innerText = formatTime(audio.duration);
        };

        audio.ontimeupdate = () => {
            const cur = audio.currentTime;
            const dur = audio.duration;
            
            curTimeEl.innerText = formatTime(cur);
            
            if (!isDraggingProgress && dur > 0) {
                const pct = (cur / dur) * 100;
                scrubberBar.style.width = pct + '%';
            }
            
            if (isSyncedLyrics && parsedLyrics.length > 0) {
                let activeIdx = -1;
                for (let i = 0; i < parsedLyrics.length; i++) {
                    if (cur >= parsedLyrics[i].time) activeIdx = i;
                    else break;
                }
                
                if (activeIdx !== -1 && activeIdx !== currentLyricIndex) {
                    const prevEl = lyricsFlow.querySelector('.am-lyric-block.active');
                    if (prevEl) prevEl.classList.remove('active');
                    
                    const currEl = document.getElementById(`lyric-${activeIdx}`);
                    if (currEl) {
                        currEl.classList.add('active');
                        const containerHeight = lyricsScroller.clientHeight;
                        const scrollPos = currEl.offsetTop - (containerHeight * 0.35);
                        lyricsScroller.scrollTo({ top: scrollPos, behavior: 'smooth' });

                        const currentLine = parsedLyrics[activeIdx];
                        updateMediaSession(currentLine.main);
                    }
                    currentLyricIndex = activeIdx;
                }
            }
        };

        btnPlay.onclick = () => { audio.paused ? audio.play().catch(()=>{}) : audio.pause(); };
        btnNext.onclick = () => playNext(1);

        const modes = [
            { key: 'list', label: 'LIST', icon: 'M17 1l4 4-4 4 M3 11l-4 4 4 4 M21 5H9a5 5 0 0 0-5 5v3 M1 15h12a5 5 0 0 0 5-5V7' },
            { key: 'random', label: 'RANDOM', icon: 'M3 3l18 18 M3 21L21 3' },
            { key: 'single', label: 'SINGLE', icon: 'M17 1l4 4-4 4 M3 11l-4 4 4 4 M21 5H9a5 5 0 0 0-5 5v3 M1 15h12a5 5 0 0 0 5-5V7 M11 15v-4h1v4' }
        ];

        btnMode.onclick = () => { 
            const currentModeIdx = modes.findIndex(m => m.key === loopMode);
            const nextMode = modes[(currentModeIdx + 1) % modes.length];
            loopMode = nextMode.key;
            
            lcdMode.innerText = nextMode.label;
            btnMode.innerHTML = `<svg width="22" height="20" viewBox="0 0 22 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="${nextMode.icon}"/></svg>`;
        };

        searchInput.oninput = () => {
            const val = searchInput.value.trim().toLowerCase();
            if (val === '') {
                filteredTracks = [...playlists[currentPlaylist]];
            } else {
                filteredTracks = playlists[currentPlaylist].filter(s => s.t.toLowerCase().includes(val));
            }
            curIdx = -1;
            renderList();
        };

        // Smooth Scrubber Tracking
        const handleSeek = (clientX) => {
            if (audio.duration > 0) {
                const rect = scrubberTouch.getBoundingClientRect();
                let pct = (clientX - rect.left) / rect.width;
                pct = Math.max(0, Math.min(1, pct));
                scrubberBar.style.width = (pct * 100) + '%';
                return pct;
            }
            return 0;
        };

        scrubberTouch.onmousedown = (e) => {
            isDraggingProgress = true;
            handleSeek(e.clientX);
            
            document.onmousemove = (ev) => { handleSeek(ev.clientX); };
            document.onmouseup = (ev) => {
                isDraggingProgress = false;
                const pct = handleSeek(ev.clientX);
                audio.currentTime = pct * audio.duration;
                document.onmousemove = null;
                document.onmouseup = null;
            };
        };

        scrubberTouch.ontouchstart = (e) => {
            isDraggingProgress = true;
            handleSeek(e.touches[0].clientX);
        };

        scrubberTouch.ontouchmove = (e) => {
            if (isDraggingProgress) handleSeek(e.touches[0].clientX);
        };

        scrubberTouch.ontouchend = (e) => {
            if (isDraggingProgress) {
                isDraggingProgress = false;
                const rect = scrubberTouch.getBoundingClientRect();
                let pct = (e.changedTouches[0].clientX - rect.left) / rect.width;
                pct = Math.max(0, Math.min(1, pct));
                if (audio.duration > 0) audio.currentTime = pct * audio.duration;
            }
        };

        // Library Synchronizer
        async function loadLibrary(user, repo) {
            if (!user || !repo) return;
            
            try {
                audio.pause(); audio.src = ''; 
                curTimeEl.innerText = '0:00'; totalTimeEl.innerText = '0:00';
                scrubberBar.style.width = '0%';
                playlists = {}; filteredTracks = []; listContainer.innerHTML = ''; navContainer.innerHTML = '';
                titleEl.innerText = 'Connecting...';
                
                processLyrics(null);
                artEl.style.backgroundImage = 'none'; dynBgEl.style.backgroundImage = 'none'; emjEl.classList.remove('hidden-ui');

                const res = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/`);
                if (!res.ok) throw new Error('Repository error or limit');
                
                const items = await res.json();
                const rootTracks = filterAudio(items);
                if (rootTracks.length > 0) playlists['Root'] = rootTracks;
                
                const folders = items.filter(i => i.type === 'dir');
                for (let f of folders) {
                    try {
                        const subRes = await fetch(f.url);
                        if (subRes.ok) {
                            const subData = await subRes.json();
                            const tracks = filterAudio(subData);
                            if (tracks.length > 0) playlists[f.name] = tracks;
                        }
                    } catch(e) {}
                }
                
                if (Object.keys(playlists).length === 0) {
                    titleEl.innerText = 'No Tracks Found';
                    return;
                }

                localStorage.setItem('jrmusic_gh_user', user);
                localStorage.setItem('jrmusic_gh_repo', repo);
                
                currentPlaylist = Object.keys(playlists)[0];
                filteredTracks = [...playlists[currentPlaylist]];
                renderNav();
                renderList();
                executeLoad(0, false);
                
            } catch (e) {
                titleEl.innerText = 'Connection Failed';
            }
        }
        
        btnSync.onclick = () => {
            const u = ghUserInp.value.trim();
            const r = ghRepoInp.value.trim();
            if (u && r) {
                syncDrawer.classList.remove('open');
                loadLibrary(u, r);
            }
        };

        loadLibrary(savedUser, savedRepo);
    </script>
</body>
